name: Build and Push Docker Image

permissions:
  contents: write

on:
  push:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2️⃣ Set up Docker Buildx (needed for multi-arch & caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Extract short commit SHA for image tag
      - name: Set image tag
        id: vars
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 5️⃣ Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./3-Tier-Application/backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/task-app-backend:${{ env.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/task-app-backend:latest

      - name: Debug repo structure
        run: |
          pwd
          ls -R


      # 6️⃣ Update image tag in deployment.yml
      - name: Update deployment image tag
        run: |
          sed -i "s|image: .*task-app-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/task-app-backend:${{ env.TAG }}|" 3-Tier-Application/k8s/backend.yml

      # 7️⃣ Commit and push manifest change
      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add 3-Tier-Application/k8s/backend.yml
          git commit -m "Update backend image to ${{ env.TAG }}"
          git push
